name: 课程订阅与邮件
run-name: "${{ github.event_name == 'schedule' && '定时归档订阅课程' || format('手动运行：{0}', inputs.operation) }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: '首次选 discover 查看课程名称与 ID；配置订阅及发送方式后，选 run 归档'
        type: choice
        options: [discover, mail-test, run]
        default: discover
      max_lectures:
        description: '每次最多处理多少节回放（仅 run 生效，不改变订阅课程）'
        type: string
        default: '1'
  schedule:
    - cron: '30 4 * * *' # 12:30 UTC+8
permissions:
  contents: write
concurrency:
  group: course-delivery
  cancel-in-progress: false
jobs:
  course:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_SCHEDULED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COURSE_OPERATION: ${{ github.event_name == 'schedule' && 'run' || inputs.operation || 'run' }}
      COURSE_ACCOUNT: ${{ secrets.COURSE_ACCOUNT }}
      COURSE_PASSWORD: ${{ secrets.COURSE_PASSWORD }}
      COURSE_FID: ${{ secrets.COURSE_FID }}
      COURSE_ENTRY_URL: ${{ secrets.COURSE_ENTRY_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_MAX_RAW_MB: ${{ vars.MAIL_MAX_RAW_MB || '18' }}
      DELIVERY: ${{ vars.DELIVERY || 'email' }}
      RELAY_KEY: ${{ secrets.RELAY_KEY }}
      MAX_LECTURES: ${{ inputs.max_lectures || vars.MAX_LECTURES || '3' }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    name: 查找课程 · 测试邮箱 · 归档订阅
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - run: uv sync --locked
      - name: 查找课程名称和 ID（查看运行摘要）
        if: env.COURSE_OPERATION == 'discover'
        run: node src/run.mjs --discover
      - name: Restore delivery receipts
        if: env.COURSE_OPERATION == 'run'
        uses: actions/cache/restore@v6.1.0
        with:
          path: local-data/state/delivery-state.enc
          key: course-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: course-receipts-
      - name: 发送邮箱测试邮件
        if: env.COURSE_OPERATION == 'mail-test'
        run: node src/run.mjs --mail-test
      - name: Install FFmpeg in the temporary runner
        if: env.COURSE_OPERATION == 'run'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: 归档已订阅课程
        if: env.COURSE_OPERATION == 'run'
        run: node src/run.mjs
      - name: 上传加密附件供本机取件
        id: upload_relay
        if: always() && !cancelled() && env.COURSE_OPERATION == 'run' && env.DELIVERY == 'relay' && hashFiles('local-data/relay-outbox/*.relay') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: course-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-data/relay-outbox/*.relay
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: 记录已上传的附件
        if: always() && steps.upload_relay.outcome == 'success'
        run: node src/run.mjs --commit-relay
      - name: Preserve successful delivery receipts
        if: always() && env.COURSE_OPERATION == 'run' && hashFiles('local-data/state/delivery-state.enc') != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: local-data/state/delivery-state.enc
          key: course-receipts-${{ github.run_id }}-${{ github.run_attempt }}
