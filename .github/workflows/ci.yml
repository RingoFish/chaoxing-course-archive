name: Test local pipeline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - run: uv sync --locked
      - name: Install FFmpeg in the temporary runner
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: sudo apt-get install -y libarchive-tools
      - run: npm test
      - run: uv run --locked python -m unittest discover -s test -p 'test_*.py' -v
      - run: node test/smoke.mjs
